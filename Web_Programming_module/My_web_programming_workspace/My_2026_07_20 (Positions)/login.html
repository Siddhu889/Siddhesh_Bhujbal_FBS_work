<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="Login">
        <h1>Login Page</h1>
        <form class="form" action="" method="post">
            <label for="username">Username:</label>
            <input type="text" name="username" id="username"><br>

            <label for="dropdown">Login As:</label>
            <select name="dropdown" id="dropdown">
                <option selected disabled>--select--</option>
                <option value="Admin">Login as Admin</option>
                <option value="User">Login as User</option>
                <option value="Student">Login as Student</option>
                <option value="Trainer">Login as Trainer</option>
            </select><br>

            <label for="phoneno">Phoneno</label>
            <input type="tel" name="phoneno" id="number" placeholder="Enter Phone Number" maxlenght="10"><br>

            <lable for="email">Email Id</lable>
            <input type="email" name="email" id="email" placeholder="Enter Email Id" required><br>

            <a href="">New User?</a>
            <a href="">Signup</a>
            <input type="submit" class="button">
        </form>
    </div>
</body>
</html>
